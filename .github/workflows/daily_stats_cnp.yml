name: Daily Stats Poster (CNP)

on:
  schedule:
    # オロチ側と同じく4回。35分ずらして同時コミットを避ける。
    - cron: '35 16,17,18,19 * * *'
    # 2026-10-03: オロチ側と同じ理由で 05:00 → 03:35 へ前倒し。
  workflow_dispatch:

# stats.csv / stats_cnp.csv を同じリポジトリにコミットするため、
# オロチ側のジョブと同時に走らないように直列化する
concurrency:
  group: stats-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      FINANCIE_SLUG: cnpninjadao
      STATS_CSV_PATH: stats_cnp.csv
      TITLE_PREFIX: 'FiNANCiE CNPスタープロジェクト'
      POST_HASHTAGS: '#CNPスタープロジェクト #CNPトークン'
      COMMUNITY_OPEN_DATE: '' # 開設日が不明なので「オープンN日目」は出さない

    steps:
      - uses: actions/checkout@v4

      # 同じ日に複数回起動するので、すでに今日の行があれば以降を全部飛ばす。
      # 手動実行（workflow_dispatch）のときは必ず動かす。
      - name: Skip if today's row already exists
        id: check
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行なので続行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif grep -q "^${TODAY}," stats_cnp.csv; then
            echo "${TODAY} の行はすでにある。この回はここで終了。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "${TODAY} の行がないので続行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Playwrightのブラウザは入れない。市況はAPI、メンバー数はHTMLから取れるため
      # HTTP経路だけで完結する（Playwrightは起動に失敗してHTTPへフォールバックする）

      - name: Run script to update stats
        if: steps.check.outputs.skip != 'true'
        env:
          # Discordチャンネルを用意したら DISCORD_WEBHOOK_URL_CNP を Secrets に追加する。
          # 未設定のうちは投稿をスキップし、CSVへの記録だけ行う。
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CNP }}
        run: python stats.py

      # 週報は土曜だけ、日次と同じ実行の中で出す（オロチ側と同じ理由）。
      # 別ワークフローにすると遅延が直列に乗り、朝の時間帯に間に合わない。
      # 遅延でUTCの日付がまたぐので、JSTの曜日で判定する（6 = 土曜）。
      - name: Post weekly report on Saturdays (JST)
        if: steps.check.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CNP }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%u)" = "6" ]; then
            echo "JSTでは土曜。週報を投稿します。"
            python stats.py --weekly
          else
            echo "JSTでは土曜ではないのでスキップ（$(TZ=Asia/Tokyo date '+%Y-%m-%d %a')）"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats_cnp.csv
          git diff --staged --quiet || (git commit -m "Update daily stats (CNP)" && git pull --rebase && git push)
