name: Weekly Stats Poster

# 定期実行は daily_stats.yml に統合した（土曜のみ、日次と同じ実行の中で出す）。
# 別ワークフローだと「日次の遅延 + 週報の遅延」が直列に乗り、
# 着地が実測中央値 08:55 まで遅れて朝の時間帯に間に合わないため。
# こちらは再実行・臨時実行用に残す。
on:
  workflow_dispatch: # 手動実行のみ

jobs:
  weekly:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post weekly report (from stats.csv)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK_URL }}
        run: python stats.py --weekly
