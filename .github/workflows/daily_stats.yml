name: Daily Stats Poster

on:
  schedule:
    - cron: '30 19 * * *' # 04:30 JST (GitHub Actions の遅延を見込んだ前倒し。目標着地 06:00 JST)
  workflow_dispatch: # for manual runs

# CNP側のジョブと同じリポジトリにコミットするため直列化する
concurrency:
  group: stats-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # この行を追加

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run script to update stats and post to Discord
        env:
          # Prefer GitHub Actions Secrets. Supports both secret names for backward compatibility.
          # vars.DISCORD_WEBHOOK_URL is a last-resort fallback (not recommended; it's not a secret).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK_URL }}
        run: python stats.py

      # 週報は土曜だけ、日次と同じ実行の中で出す。
      # 別ワークフローにすると「日次の遅延 + 週報の遅延」が直列に乗り、
      # 着地が08:55前後（実測中央値）まで遅れて朝の時間帯に間に合わないため。
      # 遅延でUTCの日付がまたぐので、JSTの曜日で判定する（6 = 土曜）。
      - name: Post weekly report on Saturdays (JST)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%u)" = "6" ]; then
            echo "JSTでは土曜。週報を投稿します。"
            python stats.py --weekly
          else
            echo "JSTでは土曜ではないのでスキップ（$(TZ=Asia/Tokyo date '+%Y-%m-%d %a')）"
          fi

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.csv
          git diff --staged --quiet || (git commit -m "Update daily stats" && git pull --rebase && git push)
