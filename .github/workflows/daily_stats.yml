name: Daily Stats Poster

on:
  schedule:
    # 01:05 / 02:05 / 03:05 / 04:05 JST の4回撃つ。
    # GitHub Actionsのスケジュール遅延は中央値+183分・最大+536分（実測n=40）で、
    # 前倒しでは尾を取り切れないため。先に成功した1回だけが実際の仕事をし、
    # 残りは最初のステップで抜ける（今日の行がもうあるかを見るだけ）。
    # 画像の生成は土日の 7/8/9時なので、テキストは08:00前に着いている必要がある。
    # 経緯: 04:30 → 03:05（2026-10-03）に前倒ししたが、10-06に +354分 が出て外れた。
    #       単発では尾を取り切れないと判断し、2026-10-06 に複数回方式へ変更。
    - cron: '05 16,17,18,19 * * *'
  workflow_dispatch: # for manual runs

# CNP側のジョブと同じリポジトリにコミットするため直列化する
concurrency:
  group: stats-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # この行を追加

    steps:
      - uses: actions/checkout@v4

      # 同じ日に複数回起動するので、すでに今日の行があれば以降を全部飛ばす。
      # 手動実行（workflow_dispatch）のときは必ず動かす。
      - name: Skip if today's row already exists
        id: check
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行なので続行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif grep -q "^${TODAY}," stats.csv; then
            echo "${TODAY} の行はすでにある。この回はここで終了。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "${TODAY} の行がないので続行"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        if: steps.check.outputs.skip != 'true'
        run: playwright install --with-deps chromium

      - name: Run script to update stats and post to Discord
        if: steps.check.outputs.skip != 'true'
        env:
          # Prefer GitHub Actions Secrets. Supports both secret names for backward compatibility.
          # vars.DISCORD_WEBHOOK_URL is a last-resort fallback (not recommended; it's not a secret).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK_URL }}
        run: python stats.py

      # 週報は土曜だけ、日次と同じ実行の中で出す。
      # 別ワークフローにすると「日次の遅延 + 週報の遅延」が直列に乗り、
      # 着地が08:55前後（実測中央値）まで遅れて朝の時間帯に間に合わないため。
      # 遅延でUTCの日付がまたぐので、JSTの曜日で判定する（6 = 土曜）。
      - name: Post weekly report on Saturdays (JST)
        if: steps.check.outputs.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK || vars.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$(TZ=Asia/Tokyo date +%u)" = "6" ]; then
            echo "JSTでは土曜。週報を投稿します。"
            python stats.py --weekly
          else
            echo "JSTでは土曜ではないのでスキップ（$(TZ=Asia/Tokyo date '+%Y-%m-%d %a')）"
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.skip != 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add stats.csv
          git diff --staged --quiet || (git commit -m "Update daily stats" && git pull --rebase && git push)
